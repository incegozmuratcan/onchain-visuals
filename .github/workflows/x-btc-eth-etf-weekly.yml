name: X BTC+ETH ETF weekly

# Dry-run by default. This job refreshes the combined BTC+ETH ETF weekly
# snapshot (both Farside tables), renders the share card at 1536×1134, and
# uploads the PNG plus caption as artifacts.
# It does not call X unless a run explicitly sets dry-run off AND the secrets
# below are present. The X user token must be for @OnchainVis.
#
# cron-job.org is the primary Sunday trigger. The GitHub schedule below is only
# a backup. Both use this workflow file:
#   POST /repos/incegozmuratcan/onchain-visuals/actions/workflows/x-btc-eth-etf-weekly.yml/dispatches
#   ref: main
#   inputs: { "dry_run": false } for a live post, true to render only
#
# Live cron-job.org schedule (Europe/Istanbul, UTC+3, no DST):
#   */30 8-23 * * 0
#   Sunday every 30 minutes from 08:00 through 23:30.
# The GitHub crons below stay as backup only (08:30 and 11:30 Istanbul).
# Both triggers run this same workflow. The concurrency group queues them, and
# both restore the same posted-state.json artifact, so a week already shared
# by either path is skipped by the other.
#
# Each pass shares only when every NYSE trading day of the target week has a
# numeric total and numeric issuer cells in BOTH the BTC and ETH Farside tables.
# A dash, a blank, or a missing cell is incomplete, not zero. Holiday dates are
# not trading days, so they are omitted from the card instead of drawn as empty
# boxes. An incomplete pass exits successfully without posting. A pass also
# skips when that week was already shared (a live post, or a dry-run that
# already recorded a success for the Monday of the week). The recorded weeks
# live in posted-state.json, which this workflow restores from the previous
# run's artifact. That state is separate from the daily card.
#
# Dry-run stays the default. The schedule follows vars.X_DRY_RUN (unset or
# true = dry run; false = live). Manual runs use workflow_dispatch and stay
# dry-run unless dry_run is set to false. A recorded dry-run does not block
# a later live post of the same week.
#
# GitHub Actions secrets — same set as the daily BTC+ETH job
# - ONCHAIN_PUBLISH_SECRET
#     Bearer token for POST /api/x/publish-btc-eth-etf-weekly. Required only for a
#     live post. This job mints a one-run value when the secret is unset so
#     the local server can authorize itself during a dry run. This is not an
#     X token.
# - X_CONSUMER_KEY
#     OAuth 1.0 Consumer Key (API Key) from the app's OAuth 1.0 Keys.
#     Required only when dry-run is off.
# - X_CONSUMER_SECRET
#     OAuth 1.0 Consumer Secret (API Key Secret). Required only when dry-run
#     is off.
# - X_ACCESS_TOKEN
#     OAuth 1.0 Access Token for @OnchainVis with Read and write. This is not
#     an OAuth 2.0 bearer. Required only when dry-run is off.
# - X_ACCESS_TOKEN_SECRET
#     OAuth 1.0 Access Token Secret for that same @OnchainVis token.
#     Required only when dry-run is off.
# - X_USER_ACCESS_TOKEN
#     Obsolete for live posts. The portal OAuth 2.0 token generator does not
#     offer media.write, so that bearer cannot upload the PNG. This job does
#     not read it.
# - X_CLIENT_ID, X_CLIENT_SECRET, X_USER_REFRESH_TOKEN
#     Not read. Live posts use the four OAuth 1.0a secrets above.
# - DATABASE_URL
#     Optional Neon/Postgres URL. When set, the refresh writes the weekly
#     ETF snapshot there. When unset, the job uses its local .onchain-cache.
# - ONCHAIN_REFRESH_SECRET or CRON_SECRET
#     Optional bearer for /api/admin/onchain/refresh and /api/cron/onchain/refresh.
#     When both are unset, the job mints a one-run secret for the server it starts.
#
# Repository variable (optional)
# - X_DRY_RUN
#     Schedule only. Leave unset or set to true to keep the dry run.
#     Set to false only when live posts should run on the schedule.
#     This is the same variable the daily job reads.
#     workflow_dispatch uses its dry_run input instead, which defaults to true.

on:
  schedule:
    # Sunday 08:30 Europe/Istanbul
    - cron: "30 5 * * 0"
    # Sunday 11:30 Europe/Istanbul
    - cron: "30 8 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (PNG + caption only). Leave true until live posting is intentional."
        type: boolean
        default: true

permissions:
  contents: read
  # Read the previous run's share record and upload this run's artifact.
  actions: write

concurrency:
  group: x-btc-eth-etf-weekly
  cancel-in-progress: false

jobs:
  btc-eth-etf-weekly:
    name: Render combined BTC+ETH ETF weekly card
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ONCHAIN_PUBLISH_SECRET: ${{ secrets.ONCHAIN_PUBLISH_SECRET }}
      X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
      X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
      X_USER_REFRESH_TOKEN: ${{ secrets.X_USER_REFRESH_TOKEN }}
      ONCHAIN_REFRESH_SECRET: ${{ secrets.ONCHAIN_REFRESH_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore the last shared ETF week
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/x-btc-eth-etf-weekly
          if [ -z "${GITHUB_REPOSITORY:-}" ] || [ -z "${GH_TOKEN:-}" ]; then
            echo "No Actions artifact API. Keeping any local post state."
            exit 0
          fi
          LIST=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=btc-eth-etf-weekly")
          ARTIFACT_ID=$(printf '%s' "$LIST" | node --input-type=module -e '
            let raw = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { raw += chunk; });
            process.stdin.on("end", () => {
              const payload = JSON.parse(raw);
              const rows = (payload.artifacts || []).filter((row) => row && row.name === "btc-eth-etf-weekly" && !row.expired);
              rows.sort((a, b) => Date.parse(b.created_at || 0) - Date.parse(a.created_at || 0));
              if (rows[0]) process.stdout.write(String(rows[0].id));
            });
          ')
          if [ -z "$ARTIFACT_ID" ]; then
            echo "No earlier share record."
            exit 0
          fi
          TMP=$(mktemp -d)
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -L \
            -o "$TMP/artifact.zip" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          unzip -q "$TMP/artifact.zip" -d "$TMP/unzip"
          FOUND=$(find "$TMP/unzip" -name posted-state.json -print -quit)
          if [ -n "$FOUND" ]; then
            cp "$FOUND" artifacts/x-btc-eth-etf-weekly/posted-state.json
            echo "Restored post state from artifact ${ARTIFACT_ID}."
          else
            echo "Latest artifact ${ARTIFACT_ID} has no post state yet."
          fi

      - name: Choose dry-run or live post
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.dry_run }}"
          else
            RAW="${{ vars.X_DRY_RUN }}"
          fi
          case "$(printf '%s' "$RAW" | tr '[:upper:]' '[:lower:]')" in
            false|0|off)
              echo "X_DRY_RUN=false" >> "$GITHUB_ENV"
              echo "Live post requested."
              ;;
            *)
              echo "X_DRY_RUN=true" >> "$GITHUB_ENV"
              echo "Dry run. X will not be called."
              ;;
          esac

      - name: Check whether this Farside week should be shared
        id: gate
        run: node scripts/x-btc-eth-etf-weekly.mjs --preflight

      - name: Install Inter for share-card text
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          if fc-list : family | grep -qi '^Inter$'; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y fonts-inter || true
          if fc-list : family | grep -qi '^Inter$'; then
            exit 0
          fi
          mkdir -p "$HOME/.local/share/fonts"
          curl -fsSL -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
          unzip -q /tmp/inter.zip -d /tmp/inter
          find /tmp/inter -name '*.ttf' -exec cp {} "$HOME/.local/share/fonts/" \;
          fc-cache -f
          fc-list : family | grep -i '^Inter$'

      - name: Install Playwright Chromium
        if: steps.gate.outputs.proceed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build Next.js app
        if: steps.gate.outputs.proceed == 'true'
        run: npm run build

      - name: Refresh, capture, and prepare the post
        if: steps.gate.outputs.proceed == 'true'
        run: node scripts/x-btc-eth-etf-weekly.mjs

      - name: Upload PNG and caption
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-etf-weekly
          path: artifacts/x-btc-eth-etf-weekly/
          if-no-files-found: warn
          retention-days: 14
