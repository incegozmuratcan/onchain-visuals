name: X BTC+ETH ETF daily

# Dry-run by default. This job refreshes the combined BTC+ETH ETF daily
# snapshot (both Farside tables), renders the share card at 1536×1024, and
# uploads the PNG plus caption as artifacts.
# It does not call X unless a run explicitly sets dry-run off AND the secrets
# below are present. The X user token must be for @OnchainVis.
#
# Daily X sharing is this combined card only. The BTC-only workflow no longer
# has a schedule. This workflow has no schedule either. Vercel Cron is the
# only timer, so GitHub Actions cannot double-fire it.
#
# Vercel Cron (vercel.json), Europe/Istanbul, UTC+3, no daylight saving.
# Tuesday–Saturday, 08:00–14:00 Istanbul (05:00–11:00 UTC) every 30 minutes,
# including both ends:
# - */30 5-10 * * 2-6  →  05:00–10:30 UTC (08:00–13:30 Istanbul)
# - 0 11 * * 2-6       →  11:00 UTC (14:00 Istanbul), last live dispatch
# Both hit GET /api/cron/x-btc-eth-etf-daily, which dispatches this workflow
# on main with dry_run=false (the string "false"). A third cron,
# 45 11 * * 2-6 (14:45 Istanbul), does not dispatch. It logs when the window
# produced no live post.
#
# Hobby cannot deploy the half-hour expression. Hobby cron runs at most once
# per day and only sometime inside the hour. Pro or Enterprise is required
# for per-minute precision. See docs/x-automation.md.
#
# Each pass shares only when the newest real Farside session for both BTC and
# ETH is the same date and fully filled: every issuer cell is a real number or
# an explicit 0. A dash, a blank, or a missing cell is incomplete, not zero.
# Farside often adds the next date as a row of dashes with a total of 0 before
# that print exists. That shell is ignored, so the previous filled session can
# still be shared. Once any issuer number is present, that row is the session
# and a partial fill does not post. An incomplete pass exits successfully
# without posting, so a later pass can share once the row is filled. A pass
# also skips when that ETF date was already shared (a live post, or a dry-run
# that already recorded a success for the date) or when Farside has no newer
# session than the last success
# (holiday or empty day). The recorded dates live in posted-state.json, which
# this workflow restores from the previous run's artifact.
#
# Manual workflow_dispatch stays a dry run unless dry_run is set to false.
# The Vercel route always sends false, so cron posts live. The choose-dry-run
# step copies that input into X_DRY_RUN for the script. It does not read
# vars.X_DRY_RUN for workflow_dispatch. The variable remains only if some
# other event is added later. A recorded dry-run does not block a later live
# post of the same date.
#
# Vercel Production env (not committed):
# - CRON_SECRET
#     Bearer for /api/cron/x-btc-eth-etf-daily. Vercel Cron sends
#     Authorization: Bearer $CRON_SECRET. The route rejects a missing or wrong
#     secret. It does not accept ONCHAIN_REFRESH_SECRET in its place.
# - GITHUB_DISPATCH_TOKEN
#     Token with Actions read and write on this repo (fine-grained PAT or
#     GitHub App). Used only to workflow_dispatch this file on main. Set it on
#     Production, not Preview.
#
# GitHub Actions secrets
# - ONCHAIN_PUBLISH_SECRET
#     Bearer token for POST /api/x/publish-btc-eth-etf-daily. Required only for a
#     live post. This job mints a one-run value when the secret is unset so
#     the local server can authorize itself during a dry run. This is not an
#     X token.
# - X_CONSUMER_KEY
#     OAuth 1.0 Consumer Key (API Key) from the app's OAuth 1.0 Keys.
#     Required only when dry-run is off.
# - X_CONSUMER_SECRET
#     OAuth 1.0 Consumer Secret (API Key Secret). Required only when dry-run
#     is off.
# - X_ACCESS_TOKEN
#     OAuth 1.0 Access Token for @OnchainVis with Read and write. This is not
#     an OAuth 2.0 bearer. Required only when dry-run is off.
# - X_ACCESS_TOKEN_SECRET
#     OAuth 1.0 Access Token Secret for that same @OnchainVis token.
#     Required only when dry-run is off.
# - X_USER_ACCESS_TOKEN
#     Obsolete for live posts. The portal OAuth 2.0 token generator does not
#     offer media.write, so that bearer cannot upload the PNG. This job does
#     not read it.
# - X_CLIENT_ID, X_CLIENT_SECRET, X_USER_REFRESH_TOKEN
#     Not read. Live posts use the four OAuth 1.0a secrets above.
# - DATABASE_URL
#     Optional Neon/Postgres URL. When set, the refresh writes the combined
#     ETF snapshot there. When unset, the job uses its local .onchain-cache.
# - ONCHAIN_REFRESH_SECRET or CRON_SECRET
#     Optional bearer for /api/admin/onchain/refresh and /api/cron/onchain/refresh.
#     When both are unset, the job mints a one-run secret for the server it starts.
#
# Repository variable (optional)
# - X_DRY_RUN
#     Not read for workflow_dispatch. Leave it as-is. Cron forces a live post
#     by passing dry_run=false. A manual run uses the dry_run input below,
#     which defaults to true.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (PNG + caption only). Leave true until live posting is intentional."
        type: boolean
        default: true

permissions:
  contents: read
  # Read the previous run's share record and upload this run's artifact.
  actions: write

concurrency:
  group: x-btc-eth-etf-daily
  cancel-in-progress: false

jobs:
  btc-eth-etf-daily:
    name: Render combined BTC+ETH ETF daily card
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ONCHAIN_PUBLISH_SECRET: ${{ secrets.ONCHAIN_PUBLISH_SECRET }}
      X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
      X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
      X_USER_REFRESH_TOKEN: ${{ secrets.X_USER_REFRESH_TOKEN }}
      ONCHAIN_REFRESH_SECRET: ${{ secrets.ONCHAIN_REFRESH_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore the last shared ETF date
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/x-btc-eth-etf-daily
          if [ -z "${GITHUB_REPOSITORY:-}" ] || [ -z "${GH_TOKEN:-}" ]; then
            echo "No Actions artifact API. Keeping any local post state."
            exit 0
          fi
          LIST=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=btc-eth-etf-daily")
          ARTIFACT_ID=$(printf '%s' "$LIST" | node --input-type=module -e '
            let raw = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { raw += chunk; });
            process.stdin.on("end", () => {
              const payload = JSON.parse(raw);
              const rows = (payload.artifacts || []).filter((row) => row && row.name === "btc-eth-etf-daily" && !row.expired);
              rows.sort((a, b) => Date.parse(b.created_at || 0) - Date.parse(a.created_at || 0));
              if (rows[0]) process.stdout.write(String(rows[0].id));
            });
          ')
          if [ -z "$ARTIFACT_ID" ]; then
            echo "No earlier share record."
            exit 0
          fi
          TMP=$(mktemp -d)
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -L \
            -o "$TMP/artifact.zip" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          unzip -q "$TMP/artifact.zip" -d "$TMP/unzip"
          FOUND=$(find "$TMP/unzip" -name posted-state.json -print -quit)
          if [ -n "$FOUND" ]; then
            cp "$FOUND" artifacts/x-btc-eth-etf-daily/posted-state.json
            echo "Restored post state from artifact ${ARTIFACT_ID}."
          else
            echo "Latest artifact ${ARTIFACT_ID} has no post state yet."
          fi

      - name: Choose dry-run or live post
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.dry_run }}"
          else
            RAW="${{ vars.X_DRY_RUN }}"
          fi
          case "$(printf '%s' "$RAW" | tr '[:upper:]' '[:lower:]')" in
            false|0|off)
              echo "X_DRY_RUN=false" >> "$GITHUB_ENV"
              echo "Live post requested."
              ;;
            *)
              echo "X_DRY_RUN=true" >> "$GITHUB_ENV"
              echo "Dry run. X will not be called."
              ;;
          esac

      - name: Check whether this Farside session should be shared
        id: gate
        run: node scripts/x-btc-eth-etf-daily.mjs --preflight

      - name: Install Inter for share-card text
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          if fc-list : family | grep -qi '^Inter$'; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y fonts-inter || true
          if fc-list : family | grep -qi '^Inter$'; then
            exit 0
          fi
          mkdir -p "$HOME/.local/share/fonts"
          curl -fsSL -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
          unzip -q /tmp/inter.zip -d /tmp/inter
          find /tmp/inter -name '*.ttf' -exec cp {} "$HOME/.local/share/fonts/" \;
          fc-cache -f
          fc-list : family | grep -i '^Inter$'

      - name: Install Playwright Chromium
        if: steps.gate.outputs.proceed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build Next.js app
        if: steps.gate.outputs.proceed == 'true'
        run: npm run build

      - name: Refresh, capture, and prepare the post
        if: steps.gate.outputs.proceed == 'true'
        run: node scripts/x-btc-eth-etf-daily.mjs

      - name: Upload PNG and caption
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-etf-daily
          path: artifacts/x-btc-eth-etf-daily/
          if-no-files-found: warn
          retention-days: 14
