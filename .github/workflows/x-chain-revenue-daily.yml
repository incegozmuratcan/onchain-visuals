name: X Chain Revenue daily

# Manual emergency use only. The Chain Revenue daily card stays on the site
# at /onchain/chain-revenue-daily. It is not posted on X (since 2026-11-23).
# This workflow has no schedule, so it cannot post on a timer. cron-job.org
# job 8880708 is disabled. Do not add a GitHub cron and do not turn that job
# back on. Weekly and monthly Chain Revenue still post on X.
#
# Dry-run by default. This job reads DefiLlama chain revenue (dailyRevenue,
# protocolType chain) for the latest completed UTC day, renders the Chain
# Revenue card at 1536×1134, and uploads the PNG plus caption as artifacts.
# It does not call X unless a run explicitly sets dry-run off AND the secrets
# below are present. The X user token must be for @OnchainVis.
#
# Manual runs use workflow_dispatch and stay dry-run unless dry_run is set
# to false.
#
# The share day is always the latest completed UTC day. The caption names that
# day with the full month name. Each value is that chain's summary
# totalDataChart point for that exact UTC day; the rolling total24h is never
# used. DefiLlama fills a finished day late, chain by chain, so a pass shares
# only when the day is complete:
#   - the number of chains with a point for the day is at least 95% of the
#     median count of the previous three days, AND
#   - every chain in the previous day's top 10 has revenue on the day.
# An incomplete pass exits successfully without posting, so a later manual
# pass can share once DefiLlama has filled the day. An older day is never
# posted late. A pass also skips when that day was already shared (a live
# post, or a dry-run that already recorded a success for the day). The
# recorded days live in posted-state.json, which this workflow restores from
# the previous run's artifact. That state is separate from the ETF cards.
#
# Dry-run stays the default. A recorded dry-run does not block a later live
# post of the same day.
#
# GitHub Actions secrets — same set as the daily BTC+ETH job
# - ONCHAIN_PUBLISH_SECRET
#     Bearer token for POST /api/x/publish-chain-revenue-daily. Required only for a
#     live post. This job mints a one-run value when the secret is unset so
#     the local server can authorize itself during a dry run. This is not an
#     X token.
# - X_CONSUMER_KEY
#     OAuth 1.0 Consumer Key (API Key) from the app's OAuth 1.0 Keys.
#     Required only when dry-run is off.
# - X_CONSUMER_SECRET
#     OAuth 1.0 Consumer Secret (API Key Secret). Required only when dry-run
#     is off.
# - X_ACCESS_TOKEN
#     OAuth 1.0 Access Token for @OnchainVis with Read and write. This is not
#     an OAuth 2.0 bearer. Required only when dry-run is off.
# - X_ACCESS_TOKEN_SECRET
#     OAuth 1.0 Access Token Secret for that same @OnchainVis token.
#     Required only when dry-run is off.
# - X_USER_ACCESS_TOKEN
#     Obsolete for live posts. The portal OAuth 2.0 token generator does not
#     offer media.write, so that bearer cannot upload the PNG. This job does
#     not read it.
# - X_CLIENT_ID, X_CLIENT_SECRET, X_USER_REFRESH_TOKEN
#     Not read. Live posts use the four OAuth 1.0a secrets above.
# - DATABASE_URL
#     Optional Neon/Postgres URL. When set, the refresh writes the chain
#     revenue snapshot there. When unset, the job uses its local .onchain-cache.
# - ONCHAIN_REFRESH_SECRET or CRON_SECRET
#     Optional bearer for /api/admin/onchain/refresh and /api/cron/onchain/refresh.
#     When both are unset, the job mints a one-run secret for the server it starts.
#
# Repository variable (optional)
# - X_DRY_RUN
#     Unused for a timer, because this workflow no longer has one.
#     workflow_dispatch uses its dry_run input instead, which defaults to true.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (PNG + caption only). Leave true until live posting is intentional."
        type: boolean
        default: true

permissions:
  contents: read
  # List and download the previous run's posted-state artifact. Upload uses
  # actions/upload-artifact@v4, which authenticates with the runner runtime
  # token and does not need actions: write. The BTC ETF workflow already
  # uploads with actions left unset.
  actions: read

concurrency:
  group: x-chain-revenue-daily
  cancel-in-progress: false

jobs:
  chain-revenue-daily:
    name: Render Chain Revenue daily card
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore the last shared chain revenue day
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/x-chain-revenue-daily
          if [ -z "${GITHUB_REPOSITORY:-}" ] || [ -z "${GH_TOKEN:-}" ]; then
            echo "No Actions artifact API. Keeping any local post state."
            exit 0
          fi
          LIST=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&name=chain-revenue-daily")
          ARTIFACT_ID=$(printf '%s' "$LIST" | node --input-type=module -e '
            let raw = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { raw += chunk; });
            process.stdin.on("end", () => {
              const payload = JSON.parse(raw);
              const rows = (payload.artifacts || []).filter((row) => row && row.name === "chain-revenue-daily" && !row.expired);
              rows.sort((a, b) => Date.parse(b.created_at || 0) - Date.parse(a.created_at || 0));
              if (rows[0]) process.stdout.write(String(rows[0].id));
            });
          ')
          if [ -z "$ARTIFACT_ID" ]; then
            echo "No earlier share record."
            exit 0
          fi
          TMP=$(mktemp -d)
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -L \
            -o "$TMP/artifact.zip" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          unzip -q "$TMP/artifact.zip" -d "$TMP/unzip"
          FOUND=$(find "$TMP/unzip" -name posted-state.json -print -quit)
          if [ -n "$FOUND" ]; then
            cp "$FOUND" artifacts/x-chain-revenue-daily/posted-state.json
            echo "Restored post state from artifact ${ARTIFACT_ID}."
          else
            echo "Latest artifact ${ARTIFACT_ID} has no post state yet."
          fi

      - name: Choose dry-run or live post
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          VAR_X_DRY_RUN: ${{ vars.X_DRY_RUN }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW="$INPUT_DRY_RUN"
          else
            RAW="$VAR_X_DRY_RUN"
          fi
          case "$(printf '%s' "$RAW" | tr '[:upper:]' '[:lower:]')" in
            false|0|off)
              echo "X_DRY_RUN=false" >> "$GITHUB_ENV"
              echo "Live post requested."
              ;;
            *)
              echo "X_DRY_RUN=true" >> "$GITHUB_ENV"
              echo "Dry run. X will not be called."
              ;;
          esac

      - name: Check whether the latest UTC day is complete and unshared
        id: gate
        run: node scripts/x-chain-revenue-daily.mjs --preflight

      - name: Install Playwright Chromium
        if: steps.gate.outputs.proceed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build Next.js app
        if: steps.gate.outputs.proceed == 'true'
        run: npm run build

      - name: Refresh, capture, and prepare the post
        if: steps.gate.outputs.proceed == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ONCHAIN_PUBLISH_SECRET: ${{ secrets.ONCHAIN_PUBLISH_SECRET }}
          ONCHAIN_REFRESH_SECRET: ${{ secrets.ONCHAIN_REFRESH_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node scripts/x-chain-revenue-daily.mjs

      - name: Upload PNG and caption
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chain-revenue-daily
          path: artifacts/x-chain-revenue-daily/
          if-no-files-found: warn
          retention-days: 14
